<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Odradek Studio — illustrative desk setup</title>
  <desc id="desc">Illustrative front schematic: RoArm on the left, a downward held stylus, Dell laptop centered on blue tape, camera on a tripod to the right aimed toward the keyboard, large curved monitor behind and a separate keyboard farther right. Positions, pose and field of view are illustrative, with measurements pending.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#294454" stroke-width=".7"/></pattern>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#19333e"/><stop offset="1" stop-color="#0a141f"/></linearGradient>
    <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#b3c5cb"/><stop offset="1" stop-color="#647e8b"/></linearGradient>
    <pattern id="keys" width="29" height="22" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="24" height="17" rx="3" fill="#162733" stroke="#6c8591" stroke-width=".7"/></pattern>
    <marker id="look" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#81dee4"/></marker>
    <style>
      text{font-family:Consolas,'Courier New',monospace;fill:#d9e5e9} .tiny{font-size:13px;letter-spacing:1.4px;fill:#91adbc}.label{font-size:19px;letter-spacing:1px}.sub{font-size:14px;fill:#96afbc}.amber{fill:#ffbd69}.cyan{fill:#81dee4}.leader{fill:none;stroke:#718e9e;stroke-width:1.5}.joint{fill:#182b38;stroke:#ffbd69;stroke-width:3}.hardware{fill:#182b38;stroke:#8da6b4;stroke-width:2}.blue{fill:#4c9df4;stroke:#a9dcff;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#0c1721"/>
  <rect x="24" y="24" width="1552" height="952" fill="none" stroke="#385464"/>
  <path d="M24 100H1576M24 845H1576" stroke="#385464"/>
  <text x="55" y="61" class="tiny">ODRADEK LAB / FIELD REFERENCE 01</text>
  <text x="55" y="85" font-size="13" fill="#91adbc">SETUP DRAFT → CURRENT CANON</text>
  <rect x="1238" y="44" width="306" height="35" fill="#342a1c" stroke="#b18c50"/>
  <text x="1253" y="67" class="tiny amber">EXAMPLE SETUP / 2026.11.13</text>
  <text x="55" y="148" font-size="32">The desk, as arranged.</text>
  <text x="55" y="177" class="sub">Front schematic · viewer facing the desk · relative placement from the supplied photo</text>
  <rect x="55" y="206" width="1490" height="602" fill="url(#grid)" opacity=".24"/>

  <!-- The large rear monitor is scenery; its private screen contents are omitted. -->
  <path d="M513 252Q970 306 1478 276L1478 611Q975 642 513 590Z" fill="#09131d" stroke="#6d8594" stroke-width="5"/>
  <path d="M528 269Q972 319 1462 292V593Q969 621 528 575Z" fill="url(#screen)" stroke="#2b5265"/>
  <path d="M541 547Q973 591 1448 566" stroke="#365c69" fill="none"/>
  <path d="M1053 627L1071 687H1195L1115 621" fill="#122632" stroke="#456373"/>
  <text x="1225" y="379" class="tiny" text-anchor="middle">REAR MONITOR</text>
  <text x="1225" y="401" class="tiny" text-anchor="middle">DISPLAY CONTENT OMITTED</text>

  <!-- Table surface and fixed arm mounting area. -->
  <path d="M68 718L1485 695L1544 785H55Z" fill="#182c38" stroke="#688492" stroke-width="2"/>
  <path d="M55 785H1544V800H55Z" fill="#0b131b" stroke="#496472"/>
  <path d="M160 703L300 701L316 744L141 747Z" fill="#1e3543" stroke="#6c8996"/>
  <ellipse cx="228" cy="700" rx="59" ry="17" fill="#192b37" stroke="#e0b16b" stroke-width="2"/>
  <rect x="182" y="628" width="91" height="70" rx="6" class="hardware"/>
  <rect x="174" y="650" width="107" height="18" fill="#244a4e" stroke="#6f9f9b"/>

name: Windows Studio verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run prepare:app
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the packaged public app
        shell: pwsh
        run: |
          node scripts/verify-learning-package.mjs release/win-unpacked > release/package-evidence.json
          if ($LASTEXITCODE -ne 0) { Get-Content release/package-evidence.json; exit 1 }
          $env:ODRADEK_TEST_PACKAGED_ROOT = Join-Path $env:GITHUB_WORKSPACE 'release/win-unpacked/resources'
          node --test test/desktop-backend.test.mjs test/offline-learning-backend.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'Public Studio package and fresh-data backend verified. Publication is a separate reviewed action.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
